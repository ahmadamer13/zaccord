<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اختر التصميم الرئيسي | 3DJordanPrint</title>
    <link rel="stylesheet" href="/animate/animate.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/index.css">
    <link rel="stylesheet" href="/style/index_style.css">
    <link rel="stylesheet" href="/style/home.css">
    <style>
      body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif}
      .grid{max-width:1100px;margin:40px auto;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
      .card{border:1px solid #e5e7eb;border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
      .card h3{margin:0 0 8px;font-size:20px}
      .card p{margin:0 0 12px;color:#374151;line-height:1.6}
      .btns{display:flex;gap:10px;flex-wrap:wrap}
      .btn{display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none}
      .primary{background:#0ea5e9;color:#fff}
      .secondary{background:#111827;color:#fff}
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        <h3>التصميم 1 — بطل عربي واضح</h3>
        <p>واجهة عربية بالكامل مع عرض السعر: "طباعة مجسمات ثلاثية الأبعاد بسعر 0.07 قرش للغرام — ابدأ بطباعة أحلامك".</p>
        <div class="btns">
          <a class="btn primary" href="/index1.html">فتح التصميم 1</a>
        </div>
      </div>
      <div class="card">
        <h3>التصميم 2 — بطل ثنائي اللغة</h3>
        <p>قسم علوي ثنائي اللغة مع زر سريع واقتباس عربي موسّع وخلفية فيديو.</p>
        <div class="btns">
          <a class="btn primary" href="/index2.html">فتح التصميم 2</a>
        </div>
      </div>
    </div>
  </body>
  </html>
